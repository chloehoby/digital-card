<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Serene Ho — BYT HVAC SOLUTIONS S/B</title>
    <meta
      name="description"
      content="Save Serene Ho's contact details directly to your phone."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ---------- Tokens ---------- */
      :root {
        --bg: #0b1116;
        --panel: #141f27;
        --panel-raised: #16232c;
        --ice: #eaf4f6;
        --steel: #7e97a0;
        --steel-dim: #48606a;
        --cyan: #33c6da;
        --cyan-bright: #7fe6f2;
        --cyan-dim: #1c3c46;
        --trace: #20404b;
        box-sizing: border-box;
      }

      * {
        box-sizing: inherit;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--bg);
        background-image: radial-gradient(
          circle,
          rgba(234, 244, 246, 0.05) 1px,
          transparent 1.4px
        );
        background-size: 20px 20px;
        color: var(--ice);
        font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px calc(32px + env(safe-area-inset-bottom, 0px));
        padding-top: calc(32px + env(safe-area-inset-top, 0px));
        min-height: 100%;
        position: relative;
      }

      /* ambient glow behind the card, like equipment lit in a dark room */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(
          ellipse 480px 420px at 50% 42%,
          rgba(51, 198, 218, 0.14),
          transparent 70%
        );
        pointer-events: none;
      }

      /* ---------- Card ---------- */
      .card {
        width: 100%;
        max-width: 380px;
        background: var(--panel-raised);
        border: 1px solid var(--trace);
        padding: 36px 30px 28px;
        position: relative;
        z-index: 1;
      }

      .corner {
        position: absolute;
        width: 14px;
        height: 14px;
        border: 1px solid var(--cyan);
        opacity: 0.65;
      }
      .corner.tl {
        top: -1px;
        left: -1px;
        border-right: none;
        border-bottom: none;
      }
      .corner.tr {
        top: -1px;
        right: -1px;
        border-left: none;
        border-bottom: none;
      }
      .corner.bl {
        bottom: -1px;
        left: -1px;
        border-right: none;
        border-top: none;
      }
      .corner.br {
        bottom: -1px;
        right: -1px;
        border-left: none;
        border-top: none;
      }

      .identity {
        margin-bottom: 20px;
      }

      .name {
        font-weight: 600;
        font-size: 1.9rem;
        line-height: 1.15;
        letter-spacing: -0.01em;
        margin: 0 0 6px;
        color: var(--ice);
      }

      .role {
        margin: 0;
        font-size: 0.92rem;
        color: var(--steel);
        line-height: 1.5;
      }

      .role strong {
        color: var(--cyan-bright);
        font-weight: 500;
      }

      /* ---------- Stat chip ---------- */
      .stat-chip {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 18px 0 24px;
        padding: 10px 14px;
        background: rgba(51, 198, 218, 0.06);
        border: 1px solid var(--cyan-dim);
      }

      .stat-chip .icon {
        flex: 0 0 auto;
        width: 18px;
        height: 18px;
        color: var(--cyan);
      }
      .stat-chip .icon svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .stat-text {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .stat-value {
        font-family: "IBM Plex Mono", monospace;
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--cyan-bright);
        line-height: 1.2;
      }

      .stat-label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.68rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--steel-dim);
      }

      .divider {
        height: 1px;
        border: none;
        margin: 0 0 22px;
        background: linear-gradient(
          to right,
          var(--trace),
          rgba(32, 64, 75, 0)
        );
      }

      /* ---------- Contact rows ---------- */
      .details {
        list-style: none;
        margin: 0 0 28px;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .details li {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        font-size: 0.9rem;
        line-height: 1.45;
      }

      .details a,
      .details span.value {
        color: var(--ice);
        text-decoration: none;
        word-break: break-word;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.86rem;
      }

      .details a:hover,
      .details a:focus-visible {
        color: var(--cyan-bright);
      }

      .icon {
        flex: 0 0 auto;
        width: 18px;
        height: 18px;
        margin-top: 1px;
        color: var(--cyan);
      }
      .icon svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* ---------- CTA ---------- */
      .cta {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 16px 20px;
        background: var(--cyan);
        color: #08161a;
        border: 1px solid var(--cyan);
        text-decoration: none;
        font-family: "Space Grotesk", sans-serif;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition: transform 120ms ease, background 200ms ease,
          box-shadow 200ms ease;
        -webkit-tap-highlight-color: transparent;
        box-shadow: 0 0 0 rgba(51, 198, 218, 0);
      }

      .cta:active {
        transform: scale(0.97);
      }

      .cta:focus-visible {
        outline: 2px solid var(--cyan-bright);
        outline-offset: 3px;
      }

      .cta.is-saved {
        background: var(--cyan-bright);
        border-color: var(--cyan-bright);
        box-shadow: 0 0 24px rgba(127, 230, 242, 0.45);
      }

      .cta .cta-icon {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
      }
      .cta .cta-icon svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .check {
        stroke-dasharray: 20;
        stroke-dashoffset: 20;
        transition: stroke-dashoffset 320ms ease 80ms;
      }
      .cta.is-saved .check {
        stroke-dashoffset: 0;
      }
      .cta.is-saved .plus {
        display: none;
      }

      .hint {
        margin: 14px 0 0;
        font-size: 0.78rem;
        color: var(--steel-dim);
        text-align: center;
        line-height: 1.5;
      }

      @media (prefers-reduced-motion: reduce) {
        .cta,
        .check,
        .stat-value {
          transition: none;
        }
      }

      @media (max-width: 340px) {
        .card {
          padding: 28px 22px 22px;
        }
        .name {
          font-size: 1.6rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>

      <div class="identity">
        <h1 class="name">Serene Ho</h1>
        <p class="role"><strong>Director</strong> — BYT HVAC SOLUTIONS S/B</p>
      </div>

      <div class="stat-chip">
        <span class="icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M12 2v20M4.9 4.9l14.2 14.2M19.1 4.9 4.9 19.1M7 8.5 12 12l5-3.5M7 15.5 12 12l5 3.5"
            />
          </svg>
        </span>
        <span class="stat-text">
          <span class="stat-value" id="statValue">34.6°C</span>
          <span class="stat-label">Avg cold-aisle inlet</span>
        </span>
      </div>

      <hr class="divider" />

      <ul class="details">
        <li>
          <span class="icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"
              />
            </svg>
          </span>
          <a href="tel:+60165214233">+60 16 521 4233</a>
        </li>
        <li>
          <span class="icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M22 6 12 13 2 6" />
              <rect x="2" y="4" width="20" height="16" rx="1.5" />
            </svg>
          </span>
          <a href="mailto:sereneho@byt-hvac.com">sereneho@byt-hvac.com</a>
        </li>
      </ul>

      <button id="addContact" class="cta" type="button">
        <span class="cta-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              class="plus"
              d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM19 8v6M22 11h-6"
            />
            <path class="check" d="M4 12.5l4.5 4.5L20 6" />
          </svg>
        </span>
        <span class="cta-label">Add to Contacts</span>
      </button>

      <p class="hint">
        Opens your phone's contacts app to save Serene's details.
      </p>
    </main>

    <script>
      document
        .getElementById("addContact")
        .addEventListener("click", function () {
          fetch("./contact-a8f39b2c.vcf")
            .then((response) => {
              if (!response.ok) throw new Error("Network response was not ok");
              return response.blob();
            })
            .then((blob) => {
              const blobUrl = window.URL.createObjectURL(blob);

              const link = document.createElement("a");
              link.href = blobUrl;
              link.download = "Serene Ho.vcf";

              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);

              window.URL.revokeObjectURL(blobUrl);
            })
            .catch((error) => {
              console.error("Download failed:", error);
              window.location.href = "./contact-a8f39b2c.vcf";
            });
        });

      (function () {
        var link = document.getElementById("addContact");
        var label = link.querySelector(".cta-label");
        var defaultLabel = label.textContent;

        link.addEventListener("click", function () {
          link.classList.add("is-saved");
          label.textContent = "Saved";
          window.setTimeout(function () {
            link.classList.remove("is-saved");
            label.textContent = defaultLabel;
          }, 2200);
        });

        // One deliberate load-time moment: the stat counts down from an
        // ambient temp to the cooled target, echoing what the product does.
        var statEl = document.getElementById("statValue");
        var reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;
        var target = 18.2;

        if (reduceMotion) {
          statEl.textContent = target.toFixed(1) + "°C";
        } else {
          var start = 34.6;
          var duration = 900;
          var startTime = null;

          function step(ts) {
            if (startTime === null) startTime = ts;
            var progress = Math.min((ts - startTime) / duration, 1);
            var eased = 1 - Math.pow(1 - progress, 3);
            var value = start - (start - target) * eased;
            statEl.textContent = value.toFixed(1) + "°C";
            if (progress < 1) {
              window.requestAnimationFrame(step);
            }
          }
          window.setTimeout(function () {
            window.requestAnimationFrame(step);
          }, 250);
        }
      })();
    </script>
  </body>
</html>
